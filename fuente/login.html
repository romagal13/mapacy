<main class="login" id="login">
  <form class="login-card" id="loginForm">
    <h1>Mapacy</h1>
    <p>Iniciá sesión para consultar el censo hidrosocial.</p>
    <label>Usuario<input id="loginUser" autocomplete="username" required></label>
    <label>Contraseña<input id="loginPassword" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Ingresar</button>
    <p class="login-error" id="loginError" role="alert"></p>
  </form>
</main>
